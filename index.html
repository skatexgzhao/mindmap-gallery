<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 Mindmap Gallery</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #fff; text-align: center; margin-bottom: 40px; font-size: 2.5em; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 30px; }
        .card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card object { width: 100%; height: 250px; display: block; }
        .card-info { padding: 20px; background: #fff; }
        .card-title { font-size: 1.2em; font-weight: 600; color: #333; margin-bottom: 8px; }
        .card-date { font-size: 0.9em; color: #666; margin-bottom: 12px; }
        .card-link {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .footer { text-align: center; color: rgba(255,255,255,0.6); margin-top: 60px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧠 Mindmap Gallery</h1>
        <div class="gallery" id="gallery"></div>
        <div class="footer">Generated by Mermaid Mindmap Generator</div>
    </div>
    <script>
        const svgs = [{"file": "拆解俞浩与追觅营销策略_20260506_085835.svg", "title": "拆解俞浩与追觅营销策略", "html": "拆解俞浩与追觅营销策略_20260506_085835.html"}, {"file": "测试脑图_20260430_133407.svg", "title": "测试脑图", "html": "测试脑图_20260430_133407.html"}, {"file": "追觅俞浩营销策略拆解_20260430_134948.svg", "title": "追觅俞浩营销策略拆解", "html": "追觅俞浩营销策略拆解_20260430_134948.html"}, {"file": "追觅营销策略-思维结构分析_20260506_090510.svg", "title": "追觅营销策略-思维结构分析", "html": "追觅营销策略-思维结构分析_20260506_090510.html"}];
        const gallery = document.getElementById('gallery');
        svgs.sort((a,b) => b.file.localeCompare(a.file));
        svgs.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = '<object data="' + item.file + '" type="image/svg+xml"></object>' +
                '<div class="card-info">' +
                '<div class="card-title">' + item.title + '</div>' +
                '<a href="' + item.file + '" class="card-link" target="_blank">查看大图</a> ' +
                '<a href="' + item.html + '" class="card-link" target="_blank">独立页面</a></div>';
            gallery.appendChild(card);
        });
    </script>
</body>
</html>
