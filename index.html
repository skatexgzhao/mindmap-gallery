            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #fff; text-align: center; margin-bottom: 40px; font-size: 2.5em; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 30px; }

            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card svg { width: 100%; height: auto; display: block; }
        .card-info { padding: 20px; background: #fff; }
        .card-title { font-size: 1.2em; font-weight: 600; color: #333; margin-bottom: 8px; }
        .card-date { font-size: 0.9em; color: #666; margin-bottom: 12px; }
        .card-link {
            display: inline-block;
            padding: 8px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9em;
        }
        .footer { text-align: center; color: rgba(255,255,255,0.6); margin-top: 60px; }
    </style>
